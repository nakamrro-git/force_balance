<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>力のつり合い</title>
<style>
:root{--bg:#f7f7f5;--fg:#222;--card:#fff;--grid:#d5d5d0;--axis:#8a8a85;--line:#ccc;--accent:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--fg:#eee;--card:#2a2a2d;--grid:#3c3c40;--axis:#85858a;--line:#444}}
:root[data-theme="dark"]{--bg:#1c1c1e;--fg:#eee;--card:#2a2a2d;--grid:#3c3c40;--axis:#85858a;--line:#444}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:1.2rem;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4}
button.on{background:#dc2626;color:#fff;border-color:#dc2626}
#msg{font-size:.9rem;margin:6px 0}
canvas{width:100%;aspect-ratio:1;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;touch-action:manipulation}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
small{opacity:.7}
</style>
</head>
<body>
<main>
<h1>力のつり合い</h1>
<div class="row">
 <label>力の数 <select id="n"><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
 <button id="start" class="p">開始</button>
 <button id="undo" disabled>1つ戻す</button>
</div>
<div id="msg">力の数を選んで「開始」を押してください。</div>
<canvas id="c"></canvas>
<div class="row" style="margin-top:10px">
 <button id="eq" class="p" disabled>つり合いの力を求める</button>
 <button id="rt" disabled>合力: OFF</button>
</div>
<div class="tw"><table>
<thead><tr><th>力</th><th>x成分</th><th>y成分</th><th>大きさ</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<small>1マス = 1 N。作用点は中央(原点)。終点はマスの交点にスナップします。つり合いの力は合力と大きさが等しく向きが逆で、全部足すと0になります。</small>
</main>
<script>
const COLORS=["#2563eb","#16a34a","#d97706","#9333ea","#0891b2"],RC="#dc2626",EC="#111827",EC_D="#fbbf24";
const G=20,H=G/2;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
let total=0,forces=[],active=false,solved=false,showR=false,S=0;

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
const dark=()=>matchMedia("(prefers-color-scheme:dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
function resize(){
 const w=cv.clientWidth,d=window.devicePixelRatio||1;
 cv.width=w*d;cv.height=w*d;S=w/G;ctx.setTransform(d,0,0,d,0,0);draw();
}
const px=x=>(x+H)*S, py=y=>(H-y)*S;
const sum=()=>({x:forces.reduce((s,f)=>s+f.x,0),y:forces.reduce((s,f)=>s+f.y,0)});

function arrow(x,y,col,w,dash){
 const x0=px(0),y0=py(0),x1=px(x),y1=py(y);
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
 ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.setLineDash([]);
 if(x===0&&y===0)return;
 const a=Math.atan2(y1-y0,x1-x0),h=Math.max(10,S*.45);
 ctx.beginPath();ctx.moveTo(x1,y1);
 ctx.lineTo(x1-h*Math.cos(a-.4),y1-h*Math.sin(a-.4));
 ctx.lineTo(x1-h*Math.cos(a+.4),y1-h*Math.sin(a+.4));ctx.closePath();ctx.fill();
}
function draw(){
 const W=G*S;ctx.clearRect(0,0,W,W);ctx.lineWidth=1;
 for(let i=0;i<=G;i++){
  ctx.strokeStyle=i===H?css("--axis"):css("--grid");
  ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,W);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(W,i*S);ctx.stroke();
 }
 forces.forEach((f,i)=>arrow(f.x,f.y,COLORS[i],2.5));
 if(solved){
  const r=sum();
  if(showR)arrow(r.x,r.y,RC,4);
  arrow(-r.x,-r.y,dark()?EC_D:EC,4,[8,5]); // つり合いの力(破線・太)
 }
 ctx.fillStyle=css("--fg");ctx.beginPath();ctx.arc(px(0),py(0),4,0,7);ctx.fill();
}
const mag=(x,y)=>Math.hypot(x,y).toFixed(2);
const nz=v=>v===0?0:v; // -0 を 0 に
function table(){
 let h="";
 forces.forEach((f,i)=>h+=`<tr><td><span class="sw" style="background:${COLORS[i]}"></span>F${i+1}</td><td>${f.x}</td><td>${f.y}</td><td>${mag(f.x,f.y)}</td></tr>`);
 if(solved){
  const r=sum();
  if(showR)h+=`<tr style="font-weight:bold;color:${RC}"><td>合力</td><td>${r.x}</td><td>${r.y}</td><td>${mag(r.x,r.y)}</td></tr>`;
  h+=`<tr style="font-weight:bold"><td>つり合いの力</td><td>${nz(-r.x)}</td><td>${nz(-r.y)}</td><td>${mag(r.x,r.y)}</td></tr>`;
 }
 $("tb").innerHTML=h;
}
function update(){
 $("undo").disabled=!active||forces.length===0||solved;
 $("eq").disabled=!(active&&forces.length===total&&!solved);
 $("rt").disabled=!solved;
 $("rt").textContent="合力: "+(showR?"ON":"OFF");
 $("rt").classList.toggle("on",showR);
 if(active){
  $("msg").textContent=solved?"つり合いの力を表示しました(破線)。合力はボタンで表示/非表示を切り替えられます。"
   :forces.length<total?`F${forces.length+1} の終点をタップしてください(${forces.length}/${total})`
   :"すべての力を指定しました。「つり合いの力を求める」を押してください。";
 }
 table();draw();
}
$("start").onclick=()=>{total=+$("n").value;forces=[];solved=false;showR=false;active=true;update();};
$("undo").onclick=()=>{forces.pop();update();};
$("eq").onclick=()=>{solved=true;update();};
$("rt").onclick=()=>{showR=!showR;update();};
cv.addEventListener("pointerdown",e=>{
 if(!active||solved||forces.length>=total)return;
 const r=cv.getBoundingClientRect(),s=r.width/G;
 const x=Math.round((e.clientX-r.left)/s-H),y=Math.round(H-(e.clientY-r.top)/s);
 if(x===0&&y===0)return;
 if(Math.abs(x)>H||Math.abs(y)>H)return;
 forces.push({x,y});update();
});
window.addEventListener("resize",resize);
resize();
</script>
</body>
</html>

</body></html>
